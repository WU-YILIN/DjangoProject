<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* 整体样式设置 */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        body {
            background-image: url("{% static 'images/background.png' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            }

        /* 表单容器样式 */
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
        }

        /* 标题样式 */
        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        /* 标签和输入框样式 */
        label {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input::placeholder {
            color: #999;
        }

        /* 按钮样式 */
        button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px); /* 按钮微微上移 */
            background-color: #0056b3;
        }
        button:active {
            transform: translateY(2px); /* 按下按钮时微微下移 */
        }

        /* 提示信息样式：放在左下方 */
        .form-footer {
            margin-top: 10px;
            color: #555;
            font-size: 14px;
            text-align: left; /* 左对齐 */
        }

        .form-footer a {
            color: #007BFF;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <form method="post">
        {% csrf_token %}

        <!-- 用户名输入框 -->
        <label for="{{ form.username.id_for_label }}">Username:</label>
        {{ form.username }}

        <!-- 密码输入框 -->
        <label for="{{ form.password.id_for_label }}">Password:</label>
        {{ form.password }}

        <!-- 登录按钮 -->
        <button type="submit">Login</button>

        <!-- 提示信息 -->
        <div class="form-footer">
            <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
        </div>
    </form>
</body>
</html>
